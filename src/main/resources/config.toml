tries = ["lobby"]

[servers]
lobby = "localhost:25565"
[logging]
errors = false
pings = true
commands = true
[settings]
motd = "A LavaProxy proxy.<newline>Total connections: {conAmount}"
port = 25577
network-compression = 256 # set to -1 to disable, 0 for every packet is compressed, and above zero for the byte threshold.
online-mode = true
[server-settings] # To override settings per-server, create a table with the name being overrides.server-name, all lowercase.
forward-mode = "none" # none, bungeecord (ip forward), bungeeguard (forward-key), velocity (forward-key)
forward-key = "" # use for bungeeguard, velocity
permissions = [
    "lavaproxy.command.server"
]
[advanced] # only change these if you know what you are doing
public-key-size = 1024
session-servers = ["https://sessionserver.mojang.com/session/minecraft/hasJoined"] # all sessionservers must be written with full path, if you get only a domain, just add /session/minecraft/hasJoined, sessionservers are tested from the order you input them.
haproxy-protocol = false # Enable the HAProxy proxy protocol
optional-haproxy = false # only is in effect if haproxy-protocol is set to true, makes HAProxy packets optional
# This feature allows special forwarding modes, for incoming connections.
# This is different from the regular forwarding-mode, as it acts on the client-side connections, and not the backend ones
# This supports the normal forward-types.
incoming-forwarding-mode = "none"
incoming-forwarding-key = "" # read above for more info on this.
incoming-forwarding-required = true